<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100%" height="100%">
  <defs>
    <radialGradient id="bubble-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#e0f2fe" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <style>
    .bubble {
      fill: url(#bubble-grad);
      stroke: #e0f2fe;
      stroke-width: 0.75;
      opacity: 0;
    }
  </style>
  
  <circle class="bubble" cx="50" cy="140" r="10">
    <animate attributeName="cy" from="140" to="10" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="cx" values="50;55;45;52;48;50" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0.9;0.7;0" dur="3.2s" repeatCount="indefinite" />
  </circle>

  <circle class="bubble" cx="35" cy="145" r="14">
    <animate attributeName="cy" from="145" to="15" dur="4.2s" begin="0.8s" repeatCount="indefinite" />
    <animate attributeName="cx" values="35;25;40;30;35" dur="4.2s" begin="0.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.85;0.85;0.6;0" dur="4.2s" begin="0.8s" repeatCount="indefinite" />
  </circle>

  <circle class="bubble" cx="65" cy="135" r="7">
    <animate attributeName="cy" from="135" to="5" dur="2.6s" begin="1.4s" repeatCount="indefinite" />
    <animate attributeName="cx" values="65;72;60;68;65" dur="2.6s" begin="1.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.95;0.95;0.5;0" dur="2.6s" begin="1.4s" repeatCount="indefinite" />
  </circle>

  <circle class="bubble" cx="42" cy="140" r="5">
    <animate attributeName="cy" from="140" to="20" dur="2.1s" begin="0.3s" repeatCount="indefinite" />
    <animate attributeName="cx" values="42;48;38;42" dur="2.1s" begin="0.3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.1s" begin="0.3s" repeatCount="indefinite" />
  </circle>

  <circle class="bubble" cx="58" cy="142" r="11">
    <animate attributeName="cy" from="142" to="12" dur="3.8s" begin="2.1s" repeatCount="indefinite" />
    <animate attributeName="cx" values="58;52;63;58" dur="3.8s" begin="2.1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.8;0.8;0.5;0" dur="3.8s" begin="2.1s" repeatCount="indefinite" />
  </circle>
</svg>
